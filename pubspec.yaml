name: flickora
description: "Flickora - The Ultimate Ad-Free Premium Movies & TV Shows Discovery App"
publish_to: "none"

version: 1.6.0+7

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Icons & Styling
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management
  provider: ^6.1.2

  # Networking & Images
  http: ^1.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Carousel & Sliders
  carousel_slider: ^5.0.0

  # Video Playback (Direct MP4/HLS Streams & YouTube Trailers)
  video_player: ^2.9.2
  youtube_player_flutter: ^9.0.1

  # Storage & Utilities
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
