name: Build Flickora APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Environment
        run: flutter doctor -v

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flickora-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          tag: "v1.5.0"
          name: "Flickora v1.5.0 (The Ultimate Cinephile Suite — Sound Lab, Universes, Directors & Trivia)"
          body: |
            ### 🚀 Flickora v1.5.0 — The Ultimate Cinephile Suite

            Flickora reaches its ultimate evolution: combining theater-grade acoustic mastering, cinematic franchise universes, auteur retrospectives, interactive trivia, and aesthetic cinematography exploration!

            #### 🌟 What's New in v1.5.0:
            - **🎚️ Cinema Sound Lab & Audio Profiles**:
              - In-player EQ acoustic DSP profiles: *Dialogue Clarity Boost* (boosts 1–3 kHz voice bands for crisp speech over loud explosions), *Midnight Compression* (night-mode audio), *IMAX Deep Bass* (low-end rumble), *Acoustic Score Mode* (symphonic separation), and *Studio Neutral*.
            - **🪐 Cinematic Universes & Franchise Chronology Hub (`FranchisesScreen`)**:
              - Dedicated universe timelines for the Marvel Cinematic Universe (MCU), Star Wars (Skywalker Saga), and Dune (Arrakis Chronicles).
              - **Dual Order Viewing Modes**: Toggle between *Theatrical Release Date Order* and *In-Universe Chronological Storyline Order*.
              - Live franchise completion progress meter integrated with your watched log.
            - **🎬 Director & Auteur Spotlight Retrospectives (`DirectorsScreen`)**:
              - Dedicated auteur hubs for Christopher Nolan, Denis Villeneuve, Quentin Tarantino, and Hayao Miyazaki.
              - Directorial hallmarks checklist, philosophical quotes, and complete ranked filmographies with 1-tap playback.
            - **🎨 Cinematography Color Palette & Aesthetic Search (`PaletteAestheticScreen`)**:
              - Extracted 5-color aesthetic swatches for films with exact hex codes.
              - Browse cinema by visual aesthetic vibe: *Neon Cyberpunk*, *Pastel Whimsy & Symmetrical Dreams*, *Golden Sunlit Dust*, and *Cold Steel & Desaturated Monolith*.
            - **⏱️ Timecode Scene Bookmarks & Personal Film Annotations (`SceneBookmark`)**:
              - Drop precise time-stamped pins during active video playback with custom scene quotes and notes.
              - Review your bookmarked scenes on the movie details screen and jump directly to that exact second in the player!
            - **🧠 Interactive Cinephile IQ Challenge (`TriviaScreen`)**:
              - Daily interactive 5-question cinema quiz with instant explanations and director facts.
              - Earn Cinephile XP (+50 XP per question) and level up ranks from *Cinephile Novice* to *Cinema Grandmaster* with streak tracking.
            - **🥓 Six Degrees of Co-Stars (Cast Connection Solver `CoStarConnectionScreen`)**:
              - Interactive Hollywood connection engine discovering the shortest chain of co-star movies linking actors together.
            - **🔔 Release Radar Alerts & Notification Center (`NotificationsScreen`)**:
              - One-tap reminder bell on upcoming movies with persistent alert tracking and live film festival broadcast feeds.
            - **💬 Multilingual Subtitles/CC & Ambient Glow Halo**:
              - Live multi-language closed captions + diffused real-time ambient lighting behind playback.
            - **👥 Synchronized Watch Party Lounge & Double Feature Generator**:
              - Live room codes (`FLK-xxx`), floating emoji reactions, and 2-film marathon pairings.
            - **📊 Letterboxd CSV Data Portability & Technical Specs Sheet**:
              - Official Letterboxd watchlist/diary export + Camera systems, aspect ratio, and audio format master sheets.
            - **🚫 100% Ad-Free**: Strictly zero ads, zero subscriptions, zero tracking.

            📲 **Download directly to your Android device:** Click `app-release.apk` below!
          allowUpdates: true
          makeLatest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
