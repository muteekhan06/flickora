name: Build Flickora APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Environment
        run: flutter doctor -v

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flickora-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          tag: "v1.4.0"
          name: "Flickora v1.4.0 (The Master Edition — Subtitles, Ambient Glow, Double Features & Watch Party)"
          body: |
            ### 👑 Flickora v1.4.0 — The Master Edition

            Flickora's definitive cinephile release — engineered with studio-grade playback, ambient immersion, social watch parties, marathon pairing, and full data portability!

            #### 🌟 What's New in v1.4.0 (The Master Edition):
            - **💬 Live Subtitles & Closed Captions Engine (`SubtitleCue`, `SubtitleTrack`)**:
              - Multilingual in-player subtitle tracks (English, Spanish, French, German, Japanese, Portuguese, off).
              - Crisp on-screen rendering with high-contrast cinematic black backdrop and responsive time-synced cue playback.
            - **✨ Cinema Ambient Glow (Ambilight Halo)**:
              - Dynamic diffused ambient lighting glow projecting behind active video playback, matching real-time scene lighting and enhancing depth in dark-room viewing.
            - **🔄 Multi-Source Stream CDN & Bitrate Switcher**:
              - Instant in-player stream source switcher (4K Master Stream, 1080p Mirror, HLS Multi-bitrate Adaptive, Studio HD Master Trailer) with seamless fallback.
            - **🍿 Double Feature Marathon Generator (`DoubleFeatureScreen`)**:
              - Curated 2-movie marathon pairings with thematic symmetry (e.g. *Interstellar* + *Arrival*, *The Dark Knight* + *Heat*, *Spirited Away* + *Spider-Verse*).
              - Combined marathon runtimes, intermission break advice, and 1-tap "Save as Stack" integration.
            - **🏆 Awards Season & Oscar Vault Tracker (`AwardsScreen`)**:
              - Dedicated Oscar Best Picture, Palme d'Or, and Academy Award winning masterworks vault.
              - Filter by decade (2020s, 2010s, 2000s, Classics), award badges, director honors, and instant 1-tap playback.
            - **👥 Synchronized Community Watch Party Lounge (`WatchPartyScreen`)**:
              - Host and join live watch rooms with 6-character room codes (`FLK-xxx`).
              - Real-time live party chat feed, participant counter & avatars, and floating animated emoji reactions (🍿, 🔥, 😱, 🤯, ❤️, 👏).
            - **🎥 Camera Tech Specs & Technical Master Sheet**:
              - Native technical metadata inspect on movie details: Aspect Ratio (e.g., 2.39:1 Panavision / 1.43:1 IMAX 70mm), Cameras, Sound Mix (Dolby Atmos, 7.1), Color Process (Dolby Vision, HDR10).
            - **📊 Letterboxd CSV Data Export**:
              - Export your entire watchlist, ratings, and watch history in official Letterboxd import CSV format directly to clipboard from Settings.
            - **🤖 CineAI Film Oracle & Roulette**: Conversational cinema AI companion + instant slot reel film picker.
            - **📚 Themed Cinema Stacks & Soundtracks Vault**: Curated stacks and Spotify / YouTube Music score deep links.
            - **🚫 100% Ad-Free**: Strictly zero ads, zero subscriptions, zero tracking.

            📲 **Download directly to your Android device:** Click `app-release.apk` below!
          allowUpdates: true
          makeLatest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
