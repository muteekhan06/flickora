name: Build Flickora APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Environment
        run: flutter doctor -v

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flickora-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          tag: "v1.1.0"
          name: "Flickora v1.1.0 (Full Cinema & Hybrid Pro Player Release)"
          body: |
            ### 🎬 Flickora v1.1.0 — Evolution Release
            - **🎥 Full-Featured Hybrid Video Player**: Native direct MP4 / HLS (`.m3u8`) full-length cinema streaming + YouTube official trailers.
            - **👆 Dual Touch Gestures**: Left vertical swipe for on-screen Brightness, Right vertical swipe for Volume.
            - **⏩ Double-Tap Scrubbing & Speeds**: Double-tap for 10s skip/rewind, speed selector (0.75x to 2.0x), and aspect ratio toggles (Fit, Zoom, 16:9).
            - **📺 TV Series Season & Episode Drilldown**: Full season selector and episode cards with stills, episode numbers, runtimes, and play buttons.
            - **🌟 Actor Biography & Filmography Screens**: Tap any actor avatar to view their detailed bio, birthplace, birthday, and filmography grid.
            - **🌐 "Where to Stream Free" Badges**: Direct detection of Tubi, Pluto TV, Freevee, and other free FAST streaming options.
            - **🎞️ Free Full-Length Movies Category**: Curated open and public-domain full movies ready to stream end-to-end inside the app.
            
            📲 **Download directly to your Android device:** Click `app-release.apk` below!
          allowUpdates: true
          makeLatest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
