name: Build Flickora APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Environment
        run: flutter doctor -v

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flickora-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          tag: "v1.3.0"
          name: "Flickora v1.3.0 (Ultra Cinema Edition — CineAI Oracle, Stacks & Roulette)"
          body: |
            ### 🚀 Flickora v1.3.0 — The Ultra Cinema Edition
            
            Flickora reaches new heights of cinematic luxury, personalization, and intelligent discovery!
            
            #### 🌟 What's New in v1.3.0:
            - **🤖 CineAI Film Oracle (`CineAiScreen`)**: Intelligent in-app conversational cinema companion with quick prompts, deep plot discussions, and interactive embedded recommendation cards.
            - **🎲 Cinema Roulette / "Spin the Reel" (`RouletteScreen`)**: Can't decide what to watch? Spin the cinematic slot reel with genre, rating, and free stream filters to pick your next feature with fanfare!
            - **📚 Curated Themed Cinema Stacks (`StacksScreen`)**: Create and organize custom film collections (e.g., *"Late Night Neon Noir"*, *"Comfort Classics"*), plus 4 official Flickora Editorial Stacks.
            - **🎼 Original Soundtracks & Score Explorer**: Discover legendary composers (Hans Zimmer, Ludwig Göransson, John Williams, etc.) with 1-tap listening on Spotify and YouTube Music.
            - **🛡️ Content & Age Advisory (Parental Guide)**: Clear color-coded content rating breakdown (Violence & Action, Suspense & Fear, Profanity, Sensuality).
            - **🎟️ Shareable Cinephile Passport (`CinephilePassportScreen`)**: Generate your verified cinema passport featuring your cinephile rank, hours logged, top genre, and hall-of-fame movie poster mosaic.
            - **🌙 Pro Player Sleep Timer**: Set a timer for 15, 30, 45, or 60 minutes with automated playback pause and countdown indicator.
            - **📖 Cinema Diary & Watch Stats**: Full Letterboxd-style logging, 5-star ratings, watch history, and personal stats dashboard.
            - **🧠 "What to Watch Tonight?" Mood Matcher & Radar**: 3-step quiz algorithm + Live premiere countdowns & Box Office leaders.
            - **🎥 Full-Featured Hybrid Video Player**: On-screen gesture controls (swipe brightness & volume), playback speeds (0.5x–2.0x), aspect ratio toggles, and public domain full streams.
            - **🚫 100% Ad-Free**: Strictly zero ads, zero subscriptions, zero tracking.
            
            📲 **Download directly to your Android device:** Click `app-release.apk` below!
          allowUpdates: true
          makeLatest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
