name: Build Flickora APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Environment
        run: flutter doctor -v

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flickora-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          tag: "v1.0.0"
          name: "Flickora v1.0.0 (Ad-Free Release)"
          body: |
            ### 🎬 Flickora v1.0.0 - Premium Ad-Free Movie & TV App
            - **Strictly 100% Zero Ads** (no popups, banners, or video ads)
            - **Official 3D Filmstrip Red branding & launcher icon**
            - **Trending Now, Top 10 Today, Movies, Series, Anime**
            - **In-App HD Video & Trailer Player**
            - **Watchlist, Favorites, and Continue Watching with progress bars**
            
            📲 **Download directly to your phone:** Click `app-release.apk` below!
          allowUpdates: true
          makeLatest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
