name: Build Flickora APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Environment
        run: flutter doctor -v

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flickora-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          tag: "v1.2.0"
          name: "Flickora v1.2.0 (Cinema Diary, Mood Matcher & Box Office Radar)"
          body: |
            ### 🍿 Flickora v1.2.0 — Major Feature Release
            
            Welcome to Flickora v1.2.0, packed with cinema-buff tools, intelligent mood matching, and personal watch tracking!
            
            #### 🌟 What's New in v1.2.0:
            - **🧠 Interactive "What to Watch Tonight?" Mood Matcher**: 3-step dynamic quiz matching your vibe, time available, and cinematic era with algorithmic accuracy.
            - **📖 Personal Cinema Diary & Review Logger**: Log any film or TV show with 1-5 star ratings, custom memories/reviews, rewatch tags, and exact watch dates (Letterboxd-style).
            - **📊 Personal Watch Stats Dashboard**: Track total movies watched, hours logged, average community vs. your ratings, and your top watched cinema genre.
            - **📡 Live Release Radar & Countdowns**: Real-time days-until-premiere countdowns for the most anticipated cinema releases.
            - **👑 Global Box Office Leaderboard**: All-time highest-grossing cinema features ranked with worldwide gross figures, domestic sales, and distributors.
            - **💡 Behind-the-Scenes Trivia & Easter Eggs**: In-depth filming secrets, Easter eggs, and cinema milestones on every movie detail screen.
            - **🔗 Enhanced FAST Streaming Links**: Direct launch to legal free streaming platforms (Tubi, Pluto TV, Freevee, etc.).
            - **🎥 Hybrid Video Player & TV Episode Selector**: Retained and polished from v1.1.0 with swipe gestures, skip controls, and public domain full streams.
            - **🚫 100% Ad-Free Experience**: Zero ads, zero tracking, pure cinematic bliss.
            
            📲 **Download directly to your Android device:** Click `app-release.apk` below!
          allowUpdates: true
          makeLatest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
