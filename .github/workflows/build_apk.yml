name: Build Flickora APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Environment
        run: flutter doctor -v

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flickora-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          tag: "v1.6.0"
          name: "Flickora v1.6.0 (The Criterion & Festival Edition — Festivals, Cinematography Lab, Binge & Quotes)"
          body: |
            ### 🏛️ Flickora v1.6.0 — The Criterion & Festival Edition

            Flickora's crowning update — bringing the prestigious pedigree of world film festivals, masterclass cinematography analysis, blind mystery cinema, and smart TV binge-watching directly into your pocket!

            #### 🌟 What's New in v1.6.0 (The Criterion & Festival Edition):
            - **🎪 Global Film Festival Circuit & Trophy Tracker (`FestivalsScreen`)**:
              - Dedicated hubs for Cannes (*Palme d'Or*), Venice (*Golden Lion*), Berlin (*Golden Bear*), and Sundance.
              - Filter by festival, year, jury president citations, and enjoy 1-tap playback of trophy-winning masterworks.
            - **💰 Box Office Financials & Production ROI Matrix**:
              - Complete economic profile on movie details: Production Budget, Domestic Gross, Worldwide Total, and Profit Multipliers (*Certified Blockbuster, Indie Sleeper Smash*).
            - **📐 Cinematography Framing & Visual Composition Lab (`CinematographyLabScreen`)**:
              - Interactive masterclass in legendary camera techniques: *The Dolly Zoom (Vertigo Effect)*, *The Unbroken Long Take (Oner)*, *Center-Weighted Symmetry*, and *The Dutch Angle*.
              - Optical principles, directorial examples, and 1-tap scene study playback.
            - **🎭 "Blind Mystery Screening" Mode (`MysteryScreeningScreen`)**:
              - Overcome choice paralysis and cognitive bias: movies presented with only an enigmatic poetic hook, runtime, and genre tags.
              - 1-tap dramatic curtain-reveal animation and instant playback!
            - **🗣️ Iconic Cinema Quotes Vault (`QuotesVaultScreen`)**:
              - Searchable catalog of the greatest lines in movie history with actor, character, context, and 1-tap copy/share quote cards.
            - **📑 Screenplay & Production Script Vault (`ScriptVaultScreen`)**:
              - Side-by-side reading of original formatted screenplay drafts and director notes for *Interstellar*, *The Dark Knight*, and *Pulp Fiction*.
            - **🏅 Cinephile Trophy & Achievement System (`AchievementsScreen`)**:
              - 25+ unlockable achievements (*Curtain Raiser, Master Archivist, Acoustic Audiophile, Cinephile Scholar, Palme d'Or Connoisseur*) with XP rewards.
            - **⏭️ Smart "Binge Next Episode" Auto-Advance & Skip Intro**:
              - Automated countdown banner for TV series episodes + in-player *Skip Intro (+85s)* quick action button.
            - **🌐 Multi-Language Audio Dub Switcher**:
              - In-player language dub selector: *Original Master Audio (Dolby Atmos / DTS-HD)*, *English Dub*, *Spanish Dub*, *French Dub*, *Japanese Audio*, and *German Dub*.
            - **📅 "On This Day in Cinema History" Daily Archive**:
              - Daily landmark cinema history moments featured directly on the home screen.
            - **🎚️ Cinema Sound Lab & Ambient Halo Glow**: Equalizer DSP presets (Dialogue Clarity Boost, Midnight Compression, IMAX Deep Bass) + real-time halo lighting.
            - **🚫 100% Ad-Free**: Strictly zero ads, zero subscriptions, zero tracking.

            📲 **Download directly to your Android device:** Click `app-release.apk` below!
          allowUpdates: true
          makeLatest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
